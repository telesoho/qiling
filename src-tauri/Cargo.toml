[package]
name = "qiling"
version = "0.1.0"
edition = "2021"
description = "器灵。桌宠听本机一句，再念出来。"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
data-encoding = "2.11.1"
edge-tts-rust = "0.1.7"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors"] }
ureq = { version = "=2.9.7", default-features = false, features = ["json", "tls"] }
url = "2"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
zip = { version = "2.6", default-features = false, features = ["deflate"] }

# 听音乐：WASAPI 回环只读取默认播放设备的输出，不做麦克风采集。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
