[package]
name = "qiling"
version = "0.1.0"
edition = "2021"
description = "器灵。桌宠听本机一句，再念出来。"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
data-encoding = "2.11.1"
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors"] }
ureq = { version = "=2.9.7", default-features = false, features = ["json", "tls"] }
url = "2"
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
