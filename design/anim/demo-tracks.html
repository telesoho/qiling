<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>诗琚 · 多轨切换演示</title>
<style>
  :root {
    --bg0: #0b1020; --bg1: #141a2e;
    --glass: rgba(255,255,255,.08); --stroke: rgba(255,255,255,.18);
    --text: #eef2ff; --muted: #9aa3c0; --glow: rgba(232,93,76,.45);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 500px at 20% 10%, rgba(232,93,76,.18), transparent 55%),
      radial-gradient(700px 420px at 80% 80%, rgba(90,140,255,.16), transparent 50%),
      linear-gradient(160deg, var(--bg0), var(--bg1));
    overflow: hidden; user-select: none;
  }
  .hud {
    position: fixed; margin: 18px 0 0 18px; padding: 14px 16px;
    width: min(420px, calc(100vw - 36px));
    background: var(--glass); border: 1px solid var(--stroke);
    border-radius: 16px; backdrop-filter: blur(16px);
    box-shadow: 0 10px 40px rgba(0,0,0,.35); z-index: 5;
  }
  .hud h1 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
  .hud p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .hud code { font-size: 11px; color: #ffc9b8; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .pill {
    font-size: 11px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid var(--stroke); background: rgba(255,255,255,.04); color: var(--muted);
    cursor: default;
  }
  .pill.switch {
    cursor: pointer;
  }
  .pill.switch:hover {
    border-color: rgba(255,255,255,.35);
    color: var(--text);
  }
  .pill.on {
    color: #fff; border-color: rgba(232,93,76,.55);
    background: rgba(232,93,76,.22); box-shadow: 0 0 16px var(--glow);
  }
  .label {
    font-size: 11px; color: var(--muted); margin-top: 12px; margin-bottom: 2px;
  }
  .stage { position: absolute; inset: 0; touch-action: none; }
  .stage.dragging { cursor: grabbing; }
  .pet {
    position: absolute; width: 180px; height: 240px;
    filter: drop-shadow(0 18px 24px rgba(0,0,0,.45));
    pointer-events: none;
  }
  .pet canvas, .pet img.clip {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; object-fit: contain;
  }
  .pet img.clip { display: none; }
  .pet.mode-webp canvas { display: none; }
  .pet.mode-webp img.clip { display: block; }
  .hit {
    position: absolute; width: 120px; height: 140px;
    pointer-events: auto; cursor: grab;
  }
  .stage.dragging .hit { cursor: grabbing; }
  .hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    padding: 10px 16px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(12px); font-size: 12px; color: var(--muted); z-index: 5;
  }
  .loader {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: rgba(8,10,20,.72); backdrop-filter: blur(8px); z-index: 10;
  }
  .loader.hidden { display: none; }
  .card {
    width: min(380px, 86vw); padding: 22px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--stroke);
  }
  .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: 12px; }
  .bar > i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg,#e85d4c,#ff9a7a); border-radius: inherit; }
  .floor {
    position: absolute; left: 10%; right: 10%; bottom: 12%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="card">
      <div style="font-weight:650;margin-bottom:4px">加载多轨目录 + 资源…</div>
      <div style="font-size:12px;color:var(--muted)" id="loadText">读取 manifest</div>
      <div class="bar"><i id="bar"></i></div>
    </div>
  </div>

  <aside class="hud">
    <h1 id="title">诗琚 · 多轨</h1>
    <p id="desc">从 <code>tracks.manifest.json</code> 切换轨；无 lift 的轨拖拽保持 idle。</p>
    <div class="label">轨道</div>
    <div class="row" id="trackRow"></div>
    <div class="label">相位</div>
    <div class="row" id="phaseRow"></div>
    <div class="row" style="margin-top:8px">
      <span class="pill" id="trackIdPill">—</span>
      <span class="pill" id="framePill">—</span>
      <span class="pill" id="assetPill">—</span>
      <span class="pill" id="verPill">v—</span>
    </div>
  </aside>

  <div class="hint" id="hint">按住拖动 · 松手放下 · 上方切换轨道</div>
  <div class="stage" id="stage">
    <div class="floor"></div>
    <div class="hit" id="hit"></div>
    <div class="pet" id="pet">
      <canvas id="cv" width="180" height="240"></canvas>
      <img class="clip" id="clip" alt="" draggable="false" />
    </div>
  </div>

<script>
(() => {
  const MANIFEST_URL = "./tracks.manifest.json";
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const pet = document.getElementById("pet");
  const clip = document.getElementById("clip");
  const hit = document.getElementById("hit");
  const stage = document.getElementById("stage");
  const loader = document.getElementById("loader");
  const bar = document.getElementById("bar");
  const loadText = document.getElementById("loadText");
  const framePill = document.getElementById("framePill");
  const assetPill = document.getElementById("assetPill");
  const verPill = document.getElementById("verPill");
  const trackIdPill = document.getElementById("trackIdPill");
  const phaseRow = document.getElementById("phaseRow");
  const trackRow = document.getElementById("trackRow");
  const hint = document.getElementById("hint");

  let manifest = null;
  let currentTrackId = null;
  let trackDir = ""; // e.g. "../characters/shiju/anim/pickup" relative to design/anim/
  let cfg = null;
  /** @type {Record<string, any>} */
  let phaseMap = {};
  /** @type {Record<string, Record<number, HTMLImageElement>>} */
  let seqCache = {};
  let fw = 180, fh = 240, fps = 24, frameDur = 1000 / 24;

  let phase = "idle";
  let frame = 1;
  let holding = false;
  let pointerId = null;
  let grabDX = 0, grabDY = 0;
  let home = { x: 0, y: 0 };
  let pos = { x: 0, y: 0 };
  let lastTick = 0, acc = 0;
  let pills = [];
  let trackPills = [];
  let webpClock = 0;
  let rafStarted = false;
  let switching = false;

  function hasPhase(name) {
    return !!(phaseMap && phaseMap[name]);
  }

  function resolveAsset(asset, ph) {
    if (!asset && ph && ph.frames) {
      return {
        type: "frameSequence",
        dir: (cfg.paths && cfg.paths.tracksDir) || "tracks",
        pattern: "frame{NNN}.webp",
        zeroPad: (cfg.format && cfg.format.zeroPad) || 3,
        from: ph.frames.from,
        to: ph.frames.to,
      };
    }
    return asset;
  }

  function pad(n, z) {
    return String(n).padStart(z || 3, "0");
  }

  /** Resolve URL relative to the track_struct directory. */
  function resolveFromTrack(rel) {
    if (!rel) return rel;
    if (/^(https?:|data:|blob:)/i.test(rel)) return rel;
    if (rel.startsWith("/")) return rel;
    // Use URL API against track directory (page is at design/anim/demo-tracks.html)
    const base = new URL("./" + trackDir.replace(/\/?$/, "/") , location.href);
    return new URL(rel, base).href;
  }

  function seqURL(asset, i) {
    const pattern = asset.pattern || "frame{NNN}.webp";
    const name = pattern.replace("{NNN}", pad(i, asset.zeroPad || 3));
    const rel = `${(asset.dir || "tracks").replace(/\/$/, "")}/${name}`;
    return resolveFromTrack(rel);
  }

  function buildTrackPills() {
    trackRow.innerHTML = "";
    trackPills = (manifest.tracks || []).map((t) => {
      const el = document.createElement("span");
      el.className = "pill switch";
      el.dataset.track = t.id;
      el.textContent = t.displayName || t.id;
      el.title = t.id;
      el.addEventListener("click", () => {
        if (t.id !== currentTrackId) switchTrack(t.id);
      });
      trackRow.appendChild(el);
      return el;
    });
    syncTrackPills();
  }

  function syncTrackPills() {
    trackPills.forEach((el) => el.classList.toggle("on", el.dataset.track === currentTrackId));
  }

  function buildPills() {
    phaseRow.innerHTML = "";
    pills = Object.entries(phaseMap).map(([key, ph]) => {
      const el = document.createElement("span");
      el.className = "pill";
      el.dataset.phase = key;
      const a = ph.asset;
      const tag = a.type === "animatedWebp" ? "webp" : `${a.from}–${a.to}`;
      el.textContent = `${ph.label || key} · ${tag}`;
      phaseRow.appendChild(el);
      return el;
    });
  }

  function setVisualMode(asset) {
    if (asset.type === "animatedWebp") {
      pet.classList.add("mode-webp");
      clip.src = resolveFromTrack(asset.src);
      assetPill.textContent = "animatedWebp";
    } else {
      pet.classList.remove("mode-webp");
      assetPill.textContent = "frameSequence";
    }
  }

  function setPhase(p) {
    if (!phaseMap[p]) return;
    phase = p;
    const ph = phaseMap[p];
    const a = ph.asset;
    setVisualMode(a);
    if (a.type === "frameSequence") {
      if (frame < a.from || frame > a.to) frame = a.from;
    } else {
      const src = resolveFromTrack(a.src);
      clip.src = src + (src.includes("?") ? "&" : "?") + "re=" + Date.now();
      webpClock = 0;
    }
    pills.forEach((el) => el.classList.toggle("on", el.dataset.phase === p));
  }

  function place(x, y) {
    const padX = 8, padY = 8;
    const maxX = stage.clientWidth - fw - padX;
    const maxY = stage.clientHeight - fh - padY;
    pos.x = Math.min(maxX, Math.max(padX, x));
    pos.y = Math.min(maxY, Math.max(padY, y));
    pet.style.left = pos.x + "px";
    pet.style.top = pos.y + "px";
    pet.style.width = fw + "px";
    pet.style.height = fh + "px";
    pet.style.transform = "none";
    hit.style.left = (pos.x + fw / 2) + "px";
    hit.style.top = (pos.y + fh * 0.42) + "px";
    hit.style.transform = "translate(-50%, -50%)";
  }

  function layoutHome() {
    home = { x: (stage.clientWidth - fw) / 2, y: stage.clientHeight * 0.58 - fh / 2 };
    if (!holding && phase === "idle") place(home.x, home.y);
  }

  function draw() {
    if (!phaseMap[phase]) return;
    const ph = phaseMap[phase];
    const a = ph.asset;
    if (a.type === "animatedWebp") {
      framePill.textContent = "webp loop";
      return;
    }
    const img = (seqCache[phase] || {})[frame];
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (img && img.complete) ctx.drawImage(img, 0, 0, fw, fh);
    framePill.textContent = `frame ${pad(frame, a.zeroPad)}`;
  }

  function advance() {
    if (!phaseMap[phase]) return;
    const ph = phaseMap[phase];
    const a = ph.asset;
    if (a.type === "animatedWebp") return;
    if (frame < a.to) {
      frame += 1;
    } else if (ph.playback === "loop") {
      frame = a.from;
    } else if (phase === "lift") {
      if (holding && hasPhase("hover")) setPhase("hover");
      else if (hasPhase("drop")) setPhase("drop");
      else setPhase("idle");
    } else if (phase === "drop") {
      place(home.x, home.y);
      setPhase("idle");
    }
  }

  function tick(t) {
    if (!lastTick) lastTick = t;
    acc += t - lastTick;
    lastTick = t;
    if (!switching) {
      while (acc >= frameDur) {
        acc -= frameDur;
        advance();
      }
      draw();
    }
    requestAnimationFrame(tick);
  }

  function onDown(e) {
    if (!holding && e.target !== hit && !hit.contains(e.target)) return;
    e.preventDefault();
    // Idle-only tracks: allow drag reposition, but no lift/hover/drop
    if (!hasPhase("lift")) {
      holding = true;
      pointerId = e.pointerId;
      stage.classList.add("dragging");
      try { hit.setPointerCapture(pointerId); } catch (_) {}
      grabDX = e.clientX - pos.x;
      grabDY = e.clientY - pos.y;
      return;
    }
    holding = true;
    pointerId = e.pointerId;
    stage.classList.add("dragging");
    try { hit.setPointerCapture(pointerId); } catch (_) {}
    grabDX = e.clientX - pos.x;
    grabDY = e.clientY - pos.y;
    if (phase === "idle" || phase === "drop") {
      setPhase("lift");
      const a = phaseMap.lift.asset;
      if (a.type === "frameSequence") frame = a.from;
    }
  }

  function onMove(e) {
    if (!holding || e.pointerId !== pointerId) return;
    e.preventDefault();
    place(e.clientX - grabDX, e.clientY - grabDY);
    if (!hasPhase("lift") || !hasPhase("hover")) return;
    const a = phaseMap.lift && phaseMap.lift.asset;
    if (phase === "lift" && a && a.type === "frameSequence" && frame >= a.to) {
      setPhase("hover");
    }
  }

  function onUp(e) {
    if (!holding || (pointerId != null && e.pointerId !== pointerId)) return;
    holding = false;
    stage.classList.remove("dragging");
    try { hit.releasePointerCapture(pointerId); } catch (_) {}
    pointerId = null;
    if (!hasPhase("drop")) {
      // idle-only: stay where dropped visually, keep idle
      return;
    }
    if (phase === "lift" || phase === "hover") {
      setPhase("drop");
      const a = phaseMap.drop.asset;
      if (a.type === "frameSequence") frame = a.from;
    }
  }

  async function loadImage(url) {
    const img = new Image();
    img.decoding = "async";
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = () => rej(new Error("fail " + url));
      img.src = url;
    });
    return img;
  }

  async function preload() {
    const jobs = [];
    for (const [name, ph] of Object.entries(phaseMap)) {
      const a = ph.asset;
      if (a.type === "animatedWebp") {
        jobs.push({ kind: "webp", name, url: resolveFromTrack(a.src) });
      } else {
        seqCache[name] = {};
        for (let i = a.from; i <= a.to; i++) {
          jobs.push({ kind: "seq", name, i, url: seqURL(a, i) });
        }
      }
    }
    let done = 0;
    const total = Math.max(jobs.length, 1);
    bar.style.width = "0%";
    if (!jobs.length) {
      bar.style.width = "100%";
      loadText.textContent = "无需预载帧";
      return;
    }
    const conc = 12;
    let idx = 0;
    async function worker() {
      while (idx < jobs.length) {
        const job = jobs[idx++];
        if (job.kind === "webp") {
          await loadImage(job.url);
        } else {
          seqCache[job.name][job.i] = await loadImage(job.url);
        }
        done++;
        bar.style.width = ((done / total) * 100).toFixed(1) + "%";
        loadText.textContent = `${done} / ${total}`;
      }
    }
    await Promise.all(Array.from({ length: conc }, () => worker()));
  }

  function clearSeqCache() {
    seqCache = {};
  }

  function trackDirFromPath(path) {
    // "../characters/shiju/anim/pickup/track_struct.json" → "../characters/shiju/anim/pickup"
    const parts = path.replace(/\\/g, "/").split("/");
    parts.pop();
    return parts.join("/") || ".";
  }

  async function loadTrackStruct(entry) {
    trackDir = trackDirFromPath(entry.path);
    const structUrl = "./" + entry.path.replace(/^\.\//, "");
    loadText.textContent = "读取 " + entry.path;
    const res = await fetch(structUrl + "?t=" + Date.now());
    if (!res.ok) throw new Error("无法读取 " + structUrl);
    cfg = await res.json();
    fps = cfg.fps || 24;
    frameDur = 1000 / fps;
    fw = (cfg.frameSize && cfg.frameSize.width) || 180;
    fh = (cfg.frameSize && cfg.frameSize.height) || 240;
    cv.width = fw; cv.height = fh;

    phaseMap = {};
    for (const [k, v] of Object.entries(cfg.phases || {})) {
      const asset = resolveAsset(v.asset, v);
      if (!asset) throw new Error("phase " + k + " 缺少 asset");
      phaseMap[k] = { ...v, asset };
    }

    document.getElementById("title").textContent = cfg.displayName || entry.displayName || entry.id;
    document.getElementById("desc").innerHTML =
      "轨 <code>" + (cfg.id || entry.id) + "</code> · 无 lift 时拖拽仅移动，不切相位。";
    verPill.textContent = "v" + (cfg.version || "?");
    trackIdPill.textContent = cfg.id || entry.id;
    currentTrackId = entry.id;
    syncTrackPills();
    buildPills();

    if (hasPhase("lift")) {
      hint.textContent = "按住拖动 · 松手放下 · 上方切换轨道";
    } else {
      hint.textContent = "本轨仅 idle · 可拖动位置 · 上方切换轨道";
    }
  }

  async function switchTrack(trackId) {
    if (switching) return;
    const entry = (manifest.tracks || []).find((t) => t.id === trackId);
    if (!entry) {
      loadText.textContent = "未知轨道：" + trackId;
      loader.classList.remove("hidden");
      return;
    }
    switching = true;
    holding = false;
    pointerId = null;
    stage.classList.remove("dragging");
    phase = "idle";
    frame = 1;
    acc = 0;
    lastTick = 0;
    clearSeqCache();
    clip.removeAttribute("src");
    pet.classList.remove("mode-webp");
    loader.classList.remove("hidden");
    bar.style.width = "0%";
    try {
      await loadTrackStruct(entry);
      await preload();
      loader.classList.add("hidden");
      layoutHome();
      place(home.x, home.y);
      setPhase("idle");
      draw();
      // update URL query without reload
      const u = new URL(location.href);
      u.searchParams.set("track", trackId);
      history.replaceState(null, "", u);
    } catch (err) {
      loadText.textContent = "加载失败：" + err;
      console.error(err);
    } finally {
      switching = false;
    }
  }

  async function loadManifest() {
    const res = await fetch(MANIFEST_URL + "?t=" + Date.now());
    if (!res.ok) throw new Error("无法读取 " + MANIFEST_URL);
    manifest = await res.json();
    buildTrackPills();
  }

  function pickInitialTrackId() {
    const q = new URLSearchParams(location.search).get("track");
    if (q && (manifest.tracks || []).some((t) => t.id === q)) return q;
    return manifest.defaultTrack || (manifest.tracks[0] && manifest.tracks[0].id);
  }

  hit.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  window.addEventListener("resize", () => {
    layoutHome();
    if (!holding) place(pos.x || home.x, pos.y || home.y);
  });

  (async () => {
    try {
      await loadManifest();
      const id = pickInitialTrackId();
      await switchTrack(id);
      if (!rafStarted) {
        rafStarted = true;
        requestAnimationFrame(tick);
      }
    } catch (err) {
      loadText.textContent = "加载失败：" + err;
      console.error(err);
    }
  })();
})();
</script>
</body>
</html>
